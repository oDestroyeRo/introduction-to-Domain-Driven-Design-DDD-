<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Marketplace modeling workshop board</title>
  <desc id="desc">A workshop board groups marketplace terms, contexts, and events.</desc>
  <rect width="640" height="360" rx="24" fill="#fffefa"/>
  <rect x="58" y="48" width="524" height="264" rx="22" fill="#f7f8f5" stroke="#dbe0dc" stroke-width="2"/>
  <path d="M218 74v238M408 74v238" stroke="#dbe0dc" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="104" y="94" font-size="17" font-weight="850" fill="#0d6766">Terms</text>
    <text x="260" y="94" font-size="17" font-weight="850" fill="#9c6416">Contexts</text>
    <text x="446" y="94" font-size="17" font-weight="850" fill="#14213d">Events</text>
  </g>
  <g fill="#e7f4f2" stroke="#0f8f8c" stroke-width="2">
