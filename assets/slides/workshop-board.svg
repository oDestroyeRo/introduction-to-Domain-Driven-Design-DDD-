    <text x="312" y="146">Ordering</text><text x="312" y="200">Payment</text><text x="312" y="254">Shipping</text>
    <text x="496" y="146">OrderPlaced</text><text x="496" y="200">Paid</text><text x="496" y="254">Shipped</text>
