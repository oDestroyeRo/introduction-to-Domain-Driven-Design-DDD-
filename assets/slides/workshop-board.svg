    <rect x="250" y="158" width="124" height="34" rx="9"/>
    <rect x="250" y="204" width="124" height="34" rx="9"/>
    <rect x="250" y="250" width="124" height="34" rx="9"/>
  </g>
  <g fill="#fffefa" stroke="#14213d" stroke-width="2">
    <rect x="424" y="112" width="148" height="34" rx="9"/>
    <rect x="424" y="158" width="148" height="34" rx="9"/>
    <rect x="424" y="204" width="148" height="34" rx="9"/>
    <rect x="424" y="250" width="148" height="34" rx="9"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#14213d" text-anchor="middle">
    <text x="138" y="134">Cart</text><text x="138" y="180">Checkout</text><text x="138" y="226">Order</text><text x="138" y="272">Parcel</text>
    <text x="312" y="134">Cart</text><text x="312" y="180">Checkout</text><text x="312" y="226">Orders</text><text x="312" y="272">Fulfillment</text>
    <text x="498" y="134">CartUpdated</text><text x="498" y="180">CheckoutSubmitted</text><text x="498" y="226">OrderCreated</text><text x="498" y="272">FulfillmentRequested</text>
  </g>
