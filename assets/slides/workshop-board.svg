    <rect x="434" y="176" width="124" height="38" rx="9"/>
    <rect x="434" y="230" width="124" height="38" rx="9"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#14213d" text-anchor="middle">
