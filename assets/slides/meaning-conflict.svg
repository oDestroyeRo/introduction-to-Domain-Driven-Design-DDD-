<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Meaning conflict between teams</title>
  <desc id="desc">Two teams use the word order for different business meanings until DDD aligns the language.</desc>
  <rect width="640" height="360" rx="24" fill="#fffefa"/>
  <path d="M36 274c96-42 172-38 248 12s164 54 304-8" fill="none" stroke="#e7f4f2" stroke-width="42" stroke-linecap="round"/>
  <rect x="54" y="76" width="200" height="146" rx="18" fill="#f7f8f5" stroke="#dbe0dc" stroke-width="2"/>
  <rect x="386" y="76" width="200" height="146" rx="18" fill="#f7f8f5" stroke="#dbe0dc" stroke-width="2"/>
  <circle cx="106" cy="126" r="26" fill="#0f8f8c"/>
  <circle cx="438" cy="126" r="26" fill="#d89222"/>
  <path d="M142 126h72M474 126h72" stroke="#14213d" stroke-width="12" stroke-linecap="round"/>
  <text x="154" y="174" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#14213d" text-anchor="middle">Order</text>
  <text x="486" y="174" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#14213d" text-anchor="middle">Order</text>
  <text x="154" y="202" font-family="Inter, Arial, sans-serif" font-size="16" fill="#66727d" text-anchor="middle">cart intent</text>
  <text x="486" y="202" font-family="Inter, Arial, sans-serif" font-size="16" fill="#66727d" text-anchor="middle">paid contract</text>
  <path d="M262 150c44-24 80-24 124 0" fill="none" stroke="#14213d" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>
  <rect x="242" y="238" width="156" height="54" rx="27" fill="#0d6766"/>
  <text x="320" y="272" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#fffefa" text-anchor="middle">shared language</text>
</svg>
